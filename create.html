<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Create Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Create Blog Page</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create.html">Create Blog</a>
        </nav>
    </header>
    <main>
        <h2>Write a New Blog Post</h2>
        <form>
            <div style="margin-bottom: 15px;">
                <label>Blog Title:</label><br>
                <input type="text" placeholder="Enter blog title" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Category:</label><br>
                <input type="text" placeholder="e.g., Technology, Lifestyle" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Blog Content:</label><br>
                <textarea rows="6" placeholder="Write your content here..." style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
            </div>
            <button type="submit" style="background-color: #2c3e50; color: white; padding: 10px 20px; border: none; cursor: pointer;">Publish Blog</button>
        </form>
    </main>
</body>
</html>
