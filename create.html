<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Create Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Create Blog Post</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create.html">Create Blog</a>
        </nav>
    </header>
    <main>
        <h2>Write a New Blog</h2>
        <form id="createPostForm">
            <div style="margin-bottom: 15px;">
                <label>Blog Title:</label><br>
                <input type="text" id="postTitle" placeholder="Enter title" style="width: 100%; padding: 8px; margin-top: 5px;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Content:</label><br>
                <textarea id="postContent" placeholder="Write your thoughts..." rows="6" style="width: 100%; padding: 8px; margin-top: 5px;" required></textarea>
            </div>
            <button type="submit" style="background-color: #2c3e50; color: white; padding: 10px 20px; border: none; cursor: pointer;">Publish Blog</button>
        </form>
    </main>

    <script>
        const createPostForm = document.getElementById('createPostForm');

        createPostForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;

            try {
                const response = await fetch('http://localhost:3000/api/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, content })
                });

                const data = await response.json();

                if (data.success) {
                    alert('Blog published successfully!');
                    window.location.href = 'dashboard.html'; // Redirect to dashboard to see it
                } else {
                    alert('Failed to publish blog.');
                }
            } catch (error) {
                console.error('Error connecting to server:', error);
                alert('Could not connect to the backend server.');
            }
        });
    </script>
</body>
</html>
