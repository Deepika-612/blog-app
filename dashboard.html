<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Dashboard</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="create.html">Create Blog</a>
        <a href="profile.html">Profile</a>

        <button onclick="logout()"
            style="background:none; border:1px solid #fff; color:#fff;
            cursor:pointer; border-radius:3px; margin-left:10px;
            padding:5px 10px;">
            Logout
        </button>
    </nav>
</header>

<main>

    <h2>Welcome, <span id="username">User</span>!</h2>

    <p id="profileInfo">Loading profile...</p>

    <h2>Your Published Blogs</h2>

    <div style="margin-bottom:20px; display:flex; gap:10px;">

        <input
            type="text"
            id="searchInput"
            placeholder="Search blogs by title..."
            onkeyup="filterPosts()"
            style="padding:8px; width:60%;
            border:1px solid #ccc; border-radius:4px;"
        >

        <select
            id="categoryFilter"
            onchange="filterPosts()"
            style="padding:8px; width:35%;
            border:1px solid #ccc; border-radius:4px;"
        >
            <option value="">All Categories</option>
            <option value="General">General</option>
            <option value="Technology">Technology</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Education">Education</option>
        </select>

    </div>

    <div id="postsContainer">
        <p>Loading your posts...</p>
    </div>

</main>

<script>

const token = localStorage.getItem('token');

if (!token) {
    alert('Please login first.');
    window.location.href = 'login.html';
}


// ===============================
// LOAD PROFILE
// ===============================

async function loadProfile() {

    try {

        const response = await fetch(
            'http://localhost:3000/api/profile',
            {
                headers: {
                    'Authorization': token
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {

            localStorage.removeItem('token');

            alert('Session expired. Please login again.');

            window.location.href = 'login.html';

            return;
        }

        document.getElementById('username').textContent =
            data.user.username;

        document.getElementById('profileInfo').textContent =
            'Email: ' + data.user.email;

    } catch (error) {

        console.error('Profile error:', error);

        document.getElementById('profileInfo').textContent =
            'Could not load profile.';
    }
}


// ===============================
// LOAD MY BLOGS
// ===============================

let allPosts = [];

async function fetchPosts() {

    try {

        const response = await fetch(
            'http://localhost:3000/api/my-blogs',
            {
                headers: {
                    'Authorization': token
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {

            alert(data.error || 'Session expired.');

            localStorage.removeItem('token');

            window.location.href = 'login.html';

            return;
        }

        allPosts = data.blogs || [];

        displayPosts(allPosts);

    } catch (error) {

        console.error('Error fetching posts:', error);

        document.getElementById('postsContainer').innerHTML =
            '<p>Could not load your posts from the server.</p>';
    }
}


// ===============================
// DISPLAY BLOGS
// ===============================

function displayPosts(posts) {

    const container =
        document.getElementById('postsContainer');

    if (!posts || posts.length === 0) {

        container.innerHTML =
            '<p>You have not published any blogs yet.</p>';

        return;
    }

    container.innerHTML = '';

    posts.forEach(post => {

        const postCard =
            document.createElement('div');

        postCard.style.cssText =
            'border:1px solid #ccc; padding:15px; ' +
            'margin-bottom:15px; border-radius:5px; ' +
            'background:#f9f9f9;';

        postCard.innerHTML = `

            <h3>
                <a href="blog.html?id=${post._id}"
                   style="color:#2c3e50; text-decoration:none;">
                    ${post.title}
                </a>
            </h3>

            <p>
                ${post.content.substring(0, 100)}...
            </p>

            <small style="color:#666;">
                By: ${post.author?.username || 'You'}
                |
                Category:
                <b>${post.category || 'General'}</b>
                |
                <a href="blog.html?id=${post._id}">
                    Read More
                </a>
            </small>

        `;

        container.appendChild(postCard);
    });
}


// ===============================
// SEARCH + CATEGORY FILTER
// ===============================

function filterPosts() {

    const searchQuery =
        document.getElementById('searchInput')
        .value
        .toLowerCase();

    const selectedCategory =
        document.getElementById('categoryFilter').value;

    const filtered =
        allPosts.filter(post => {

            const matchesTitle =
                post.title
                .toLowerCase()
                .includes(searchQuery);

            const matchesCategory =
                selectedCategory === '' ||
                post.category === selectedCategory;

            return matchesTitle && matchesCategory;
        });

    displayPosts(filtered);
}


// ===============================
// LOGOUT
// ===============================

function logout() {

    localStorage.removeItem('token');

    alert('Logged out successfully!');

    window.location.href = 'index.html';
}


// ===============================
// START
// ===============================

loadProfile();
fetchPosts();

</script>

</body>
</html>
