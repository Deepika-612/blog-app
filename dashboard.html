<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Dashboard</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create.html">Create Blog</a>
            <button onclick="logout()" style="background: none; border: 1px solid #fff; color: #fff; cursor: pointer; border-radius: 3px; margin-left: 10px; padding: 5px 10px;">Logout</button>
        </nav>
    </header>
    <main>
        <h2>Your Published Blogs</h2>

        <!-- Search and Category Filter Section -->
        <div style="margin-bottom: 20px; display: flex; gap: 10px;">
            <input type="text" id="searchInput" placeholder="Search blogs by title..." onkeyup="filterPosts()" style="padding: 8px; width: 60%; border: 1px solid #ccc; border-radius: 4px;">
            
            <select id="categoryFilter" onchange="filterPosts()" style="padding: 8px; width: 35%; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">All Categories</option>
                <option value="General">General</option>
                <option value="Technology">Technology</option>
                <option value="Lifestyle">Lifestyle</option>
                <option value="Education">Education</option>
            </select>
        </div>

        <div id="postsContainer">
            <p>Loading posts...</p>
        </div>
    </main>

    <script>
        let allPosts = []; // Store all posts globally for filtering

        async function fetchPosts() {
            try {
                const response = await fetch('http://localhost:3000/api/blogs');
                allPosts = await response.json();
                displayPosts(allPosts);
            } catch (error) {
                console.error('Error fetching posts:', error);
                document.getElementById('postsContainer').innerHTML = '<p>Could not load posts from the server.</p>';
            }
        }

        function displayPosts(posts) {
            const container = document.getElementById('postsContainer');
            
            if (!posts || posts.length === 0) {
                container.innerHTML = '<p>No blog posts found.</p>';
                return;
            }

            container.innerHTML = '';
            posts.forEach(post => {
                const postCard = document.createElement('div');
                postCard.style.cssText = 'border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; background: #f9f9f9;';
                postCard.innerHTML = `
                    <h3><a href="blog.html?id=${post._id}" style="color: #2c3e50; text-decoration: none;">${post.title}</a></h3>
                    <p>${post.content.substring(0, 100)}...</p>
                    <small style="color: #666;">By: ${post.author || 'Anonymous'} | Category: <b>${post.category || 'General'}</b> | <a href="blog.html?id=${post._id}">Read More</a></small>
                    <div style="margin-top: 10px;">
                        <button onclick="editBlog('${post._id}')" style="background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin-right: 5px;">Edit</button>
                        <button onclick="deleteBlog('${post._id}')" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Delete</button>
                    </div>
                `;
                container.appendChild(postCard);
            });
        }

        function filterPosts() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;

            const filtered = allPosts.filter(post => {
                const matchesTitle = post.title.toLowerCase().includes(searchQuery);
                const matchesCategory = selectedCategory === "" || post.category === selectedCategory;
                return matchesTitle && matchesCategory;
            });

            displayPosts(filtered);
        }

        async function deleteBlog(id) {
            if (confirm('Are you sure you want to delete this blog?')) {
                try {
                    const response = await fetch(`http://localhost:3000/api/blogs/${id}`, {
                        method: 'DELETE'
                    });
                    const result = await response.json();
                    if (result.success) {
                        alert('Blog deleted successfully!');
                        fetchPosts(); // Refresh the list
                    } else {
                        alert('Failed to delete blog.');
                    }
                } catch (err) {
                    console.error('Error deleting blog:', err);
                }
            }
        }

        function editBlog(id) {
            const currentPost = allPosts.find(p => p._id === id);
            const newTitle = prompt('Enter new blog title:', currentPost ? currentPost.title : '');
            const newCategory = prompt('Enter category (General, Technology, Lifestyle, Education):', currentPost ? currentPost.category : 'General');
            const newContent = prompt('Enter new blog content:', currentPost ? currentPost.content : '');
            
            if (newTitle && newContent) {
                fetch(`http://localhost:3000/api/blogs/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle, content: newContent, category: newCategory || 'General' })
                })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        alert('Blog updated successfully!');
                        fetchPosts(); // Refresh the list
                    } else {
                        alert('Failed to update blog.');
                    }
                })
                .catch(err => console.error('Error updating blog:', err));
            }
        }

        // Initial load
        fetchPosts();

        function logout() {
            alert('Logged out successfully!');
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
