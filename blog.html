<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Blog Details</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create.html">Create Blog</a>
        </nav>
    </header>
    <main style="max-width: 800px; margin: 20px auto; padding: 20px;">
        <div id="blogDetailContainer">
            <p>Loading blog details...</p>
        </div>
        <br>
        <a href="dashboard.html" style="color: #2c3e50; text-decoration: underline;">&larr; Back to Dashboard</a>
    </main>

    <script>
        async function fetchBlogDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');

            const container = document.getElementById('blogDetailContainer');

            if (!blogId) {
                container.innerHTML = '<p style="color: red;">No blog ID provided.</p>';
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/blogs/${blogId}`);
                const blog = await response.json();

                if (response.ok) {
                    container.innerHTML = `
                        <h2 style="margin-bottom: 10px;">${blog.title}</h2>
                        <small style="color: #666; display: block; margin-bottom: 20px;">By: ${blog.author || 'Anonymous'}</small>
                        <hr style="border: 0; border-top: 1px solid #ddd; margin-bottom: 20px;">
                        <p style="line-height: 1.6; font-size: 1.1em;">${blog.content}</p>
                    `;
                } else {
                    container.innerHTML = `<p style="color: red;">${blog.error || 'Blog not found.'}</p>`;
                }
            } catch (error) {
                console.error('Error fetching blog details:', error);
                container.innerHTML = '<p style="color: red;">Could not connect to the server to load blog details.</p>';
            }
        }

        fetchBlogDetail();
    </script>
</body>
</html>
