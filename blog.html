<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Blog Details</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="create.html">Create Blog</a>

        <button onclick="logout()"
            style="background:none; border:1px solid #fff;
            color:#fff; cursor:pointer; border-radius:3px;
            margin-left:10px; padding:5px 10px;">
            Logout
        </button>
    </nav>
</header>

<main>

    <div id="blogContainer">
        <p>Loading blog...</p>
    </div>

    <br>

    <button onclick="goBack()">
        Back to Dashboard
    </button>

</main>

<script>

    const token = localStorage.getItem('token');

    if (!token) {
        alert('Please login first.');
        window.location.href = 'login.html';
    }


    async function loadBlog() {

        const params = new URLSearchParams(window.location.search);
        const blogId = params.get('id');

        if (!blogId) {
            document.getElementById('blogContainer').innerHTML =
                '<p>Blog ID not found.</p>';
            return;
        }

        try {

            const response = await fetch(
                `http://localhost:3000/api/blogs/${blogId}`
            );

            const data = await response.json();

            if (!response.ok || !data.success) {

                document.getElementById('blogContainer').innerHTML =
                    '<p>Could not load blog details.</p>';

                return;
            }

            const blog = data.blog;

            const authorName =
                blog.author && blog.author.username
                ? blog.author.username
                : 'Anonymous';

            document.getElementById('blogContainer').innerHTML = `

                <h2>${blog.title}</h2>

                <p style="color:#666;">
                    By: ${authorName}
                    |
                    Category:
                    <b>${blog.category || 'General'}</b>
                </p>

                <hr>

                <p style="line-height:1.7;">
                    ${blog.content}
                </p>

            `;

        } catch (error) {

            console.error('Error loading blog:', error);

            document.getElementById('blogContainer').innerHTML =
                '<p>Could not connect to the server to load blog details.</p>';
        }
    }


    function goBack() {
        window.location.href = 'dashboard.html';
    }


    function logout() {

        localStorage.removeItem('token');

        alert('Logged out successfully!');

        window.location.href = 'index.html';
    }


    loadBlog();

</script>

</body>
</html>
