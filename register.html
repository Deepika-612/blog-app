<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Register Page</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create.html">Create Blog</a>
        </nav>
    </header>
    <main>
        <h2>Create an Account</h2>
        <form>
            <div style="margin-bottom: 15px;">
                <label>Full Name:</label><br>
                <input type="text" placeholder="Enter your name" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Email:</label><br>
                <input type="email" placeholder="Enter your email" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Password:</label><br>
                <input type="password" placeholder="Create a password" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <button type="submit" style="background-color: #2c3e50; color: white; padding: 10px 20px; border: none; cursor: pointer;">Register</button>
        </form>
    </main>
</body>
</html>
